<html lang="en">
<head>
<meta charset="utf-8" />
<title>GrowthLens</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: "Mulish", ui-sans-serif, system-ui, sans-serif; background: #F7F7F8; color: #1A1B1F; }
  .frame-hatch {
    background: repeating-linear-gradient(45deg, #ECECEE 0 1px, #F7F7F8 1px 8px);
    border: 1px dashed #D9D9DD; color: #7B7E85;
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px;
  }
  button { font-family: inherit; }

  /* Initial loader — shown until React mounts and replaces #root children. */
  #initial-loader {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #F7F7F8;
  }
  .gl-loader-stack { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .gl-loader-row { display: flex; align-items: center; gap: 14px; }
  .gl-loader-wordmark {
    font-family: "Crimson Pro", Georgia, serif;
    font-size: 38px; font-weight: 600; color: #1A1B1F;
    letter-spacing: -0.5px; line-height: 1;
  }
  .gl-loader-rule {
    height: 2px; width: 140px; background: #C8A84A;
    animation: gl-pulse 1.4s ease-in-out infinite;
  }
  .gl-loader-label {
    font-family: "Archivo Narrow", "Mulish", system-ui, sans-serif;
    font-size: 11px; color: #7B7E85;
    text-transform: uppercase; letter-spacing: 1.6px; font-weight: 700;
  }
  @keyframes gl-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gl-loader-rule { animation: none; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script src="heatmap-data.js"></script>
<script src="demo-data.js"></script>
<!-- Real ingestion engine. The import map resolves DuckDB-WASM's apache-arrow peer dependency
     same-origin (there is no build step). The loader module attaches window.GL lazily — importing it
     only parses ~236 KB of JS; the 34 MB WASM + worker don't load until the first upload. -->
<script type="importmap">
{ "imports": { "apache-arrow": "./vendor/duckdb/apache-arrow.mjs" } }
</script>
<script src="engine/stats.js"></script>
<script src="engine/ingest.js"></script>
<script src="engine/compute.js"></script>
<script type="module" src="engine/duckdb-loader.mjs"></script>
<script type="text/babel" src="forest-shared.jsx"></script>
<script type="text/babel" src="heatmap-variants.jsx"></script>
<script type="text/babel" src="forest-final.jsx"></script>
<script type="text/babel" src="app-shell.jsx"></script>
<script type="text/babel" src="demographics.jsx"></script>
<script type="text/babel" src="achievement.jsx"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script type="text/babel" src="export.jsx"></script>
</head>
<body>
<div id="root">
  <div id="initial-loader">
    <div class="gl-loader-stack">
      <div class="gl-loader-row">
        <svg width="56" height="18" viewBox="0 0 40 22" aria-hidden="true">
          <rect x="0" y="9" width="40" height="4" fill="#D9D9DD" rx="1"></rect>
          <rect x="12" y="9" width="14" height="4" fill="#C8A84A" rx="1"></rect>
          <rect x="26" y="9" width="14" height="4" fill="#003DA5" rx="1"></rect>
          <line x1="26" y1="3" x2="26" y2="19" stroke="#1A1B1F" stroke-width="1.4"></line>
          <line x1="12" y1="6" x2="12" y2="16" stroke="#7B7E85" stroke-width="1.2" stroke-dasharray="2 2"></line>
        </svg>
        <div class="gl-loader-wordmark">GrowthLens</div>
      </div>
      <div class="gl-loader-rule"></div>
      <div class="gl-loader-label">Loading</div>
    </div>
  </div>
</div>
<script type="text/babel">
// Load grade × subject × year conversion factors before the first render so
// the weeks-of-learning unit toggle has real data to look up. The initial
// loader stays visible until this finishes; fallback to a typical MAP
// constant if the fetch fails so the app still renders sensibly.
(async function bootstrap() {
  try {
    const res = await fetch('reference/20260512_conversion_factors.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    window.CONVERSION_FACTORS = await res.json();
  } catch (e) {
    console.warn('Conversion factors load failed, using fallback:', e);
    window.CONVERSION_FACTORS = null;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<window.AppBody />);
})();
</script>
</body>
</html>
