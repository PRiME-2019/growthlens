<html lang="en">
<head>
<meta charset="utf-8" />
<title>GrowthLens · Admin</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: "Mulish", ui-sans-serif, system-ui, sans-serif; background: #F7F7F8; color: #1A1B1F; }
  button, input, textarea, select { font-family: inherit; }
  .gl-focus:focus-visible, input:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid #003DA5; outline-offset: 1px;
  }
  #boot-msg { display: flex; height: 100%; align-items: center; justify-content: center;
              color: #6F727A; font-size: 14px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="engine/csv.js"></script>
<script src="engine/resources.js"></script>
<script type="text/babel" src="admin.jsx"></script>
</head>
<body>
<div id="root"><div id="boot-msg">Loading admin panel…</div></div>
<script type="text/babel">
try {
  if (!window.AdminApp) throw new Error('admin scripts failed to compile or load');
  ReactDOM.createRoot(document.getElementById('root')).render(<window.AdminApp />);
} catch (e) {
  console.error('Admin panel failed to start:', e);
  const el = document.getElementById('boot-msg');
  if (el) el.textContent = 'Something went wrong while loading — please reload the page';
}
</script>
</body>
</html>
