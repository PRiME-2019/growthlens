<!--
  GrowthLens admin OTP email template.
  Paste into: Supabase Dashboard → Authentication → Email Templates → Magic Link
  (this template is used for email-OTP sign-in codes; keep {{ .Token }} intact).
  Subject line: Your GrowthLens sign-in code
  Email-safe: single table, inline CSS only, no webfonts (Georgia stands in
  for Crimson Pro).

  DELIBERATELY LINK-FREE — do not add {{ .ConfirmationURL }} back. Outlook
  SafeLinks (and similar corporate scanners) rewrite and PREFETCH links; a
  prefetched magic link is consumed before the human clicks it, which breaks
  sign-in with "token expired or invalid". A typed code gives scanners nothing
  to click. The panel's code boxes are the only sign-in path by design.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F7F7F8;padding:32px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background-color:#FFFFFF;border:1px solid #EDEDEF;border-radius:12px;">
        <tr>
          <td style="height:3px;background-color:#C8A84A;border-radius:12px 12px 0 0;font-size:0;line-height:0;">&nbsp;</td>
        </tr>
        <tr>
          <td style="padding:30px 36px 8px 36px;">
            <div style="font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:600;color:#1A1B1F;letter-spacing:-0.4px;">GrowthLens</div>
            <div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:bold;color:#6F727A;letter-spacing:1.4px;text-transform:uppercase;padding-top:2px;">Admin sign-in</div>
          </td>
        </tr>
        <tr>
          <td style="padding:14px 36px 0 36px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#3F4147;">
            Here&rsquo;s your one-time sign-in code:
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:18px 36px 6px 36px;">
            <div style="display:inline-block;background-color:#F0F4FB;border-radius:10px;padding:14px 24px;font-family:'Courier New',Courier,monospace;font-size:30px;font-weight:bold;letter-spacing:6px;color:#003DA5;">{{ .Token }}</div>
          </td>
        </tr>
        <tr>
          <td style="padding:14px 36px 26px 36px;font-family:Arial,Helvetica,sans-serif;font-size:12.5px;line-height:1.6;color:#6F727A;">
            This code expires in one hour. If you didn&rsquo;t request it, you can safely ignore this email.
          </td>
        </tr>
        <tr>
          <td style="padding:14px 36px 18px 36px;border-top:1px solid #EDEDEF;font-family:Arial,Helvetica,sans-serif;font-size:11.5px;color:#6F727A;">
            PRiME Center &middot; Saint Louis University
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
